<title>영감 · 쇼케이스</title>
<style>
:root{--ink:#1E1E1E;--lime:#CFFF68;--pink:#F8AEDF;--cobalt:#2745A0;--inspire:#6B4EFF;--bg:#fff;--fg:#1E1E1E;--mute:#8b8f97;--line:#ececef;--soft:#f3f4f6}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic","Noto Sans KR",sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit}
header.top{position:sticky;top:0;z-index:40;background:#fff;border-bottom:1px solid #ececef}
.top-in{max-width:1400px;margin:0 auto;padding:12px 28px;display:flex;align-items:center;gap:20px}
.logo-a{display:flex;align-items:center;flex:none;color:var(--ink);text-decoration:none}
.logo-a svg.logo{display:block;height:28px;width:auto}
.logo-t{font-family:"Arial Black","Pretendard",sans-serif;font-size:26px;font-weight:900;letter-spacing:-.01em;white-space:nowrap;line-height:1}
.back{margin-left:auto;display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;background:#f1f2f4;color:var(--ink);text-decoration:none;font-size:14px;font-weight:700}
.back:hover{background:#e6e7ea}
.hero{background:var(--inspire);color:#fff;padding:36px 0 28px}
.hero-in{max-width:1400px;margin:0 auto;padding:0 28px}
.crumb{margin:0 0 10px;font-size:13px;font-weight:600;opacity:.75}
.crumb a{color:#fff;text-decoration:none;border-bottom:1px solid rgba(255,255,255,.45)}
.hero h1{margin:0;font-size:clamp(28px,4vw,42px);font-weight:800;letter-spacing:-.025em}
.hero .blurb{margin:8px 0 0;font-size:15px;opacity:.85}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.tab{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;border:1.5px solid rgba(255,255,255,.45);background:transparent;color:#fff;text-decoration:none;font-size:13px;font-weight:700}
.tab span{opacity:.75;font-weight:600}
.tab[aria-current=page],.tab:hover{background:#fff;color:var(--inspire);border-color:#fff}
.tab[aria-current=page] span,.tab:hover span{opacity:.7;color:inherit}
.wrap{max-width:1400px;margin:0 auto;padding:28px 28px 64px}
.meta{margin:0 0 18px;color:var(--mute);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px 18px}
.card{display:flex;flex-direction:column;min-width:0;color:inherit;text-decoration:none}
.card .ph{display:block;position:relative;aspect-ratio:4/3;border-radius:12px;overflow:hidden;background:var(--soft)}
.card img{display:block;width:100%;height:100%;object-fit:cover}
.card:hover .ph{box-shadow:0 8px 24px rgba(0,0,0,.14);transform:translateY(-2px);transition:transform .2s,box-shadow .2s}
.card .t{display:block;margin-top:10px;font-size:15px;font-weight:700;letter-spacing:-.01em;line-height:1.35}
.card .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.card .tag{display:inline-block;padding:3px 10px;border-radius:999px;background:var(--soft);color:var(--mute);font-size:12px;font-weight:600}
.card .board{display:block;margin-top:6px;font-size:12px;color:var(--mute)}
.empty{padding:48px 0;text-align:center;color:var(--mute)}
@media (max-width:1000px){.grid{grid-template-columns:repeat(3,1fr)}}
@media (max-width:700px){.grid{grid-template-columns:repeat(2,1fr);gap:16px 12px}.top-in,.hero-in,.wrap{padding-left:16px;padding-right:16px}.hero{padding-top:28px}}
@media (max-width:420px){.grid{grid-template-columns:1fr}}
</style>
</head>
